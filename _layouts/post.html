---
layout: default
---

<article class="post-page">

  <div class="post-header">

    <p class="post-date">
      {{ page.date | date: "%Y.%m.%d" }}
    </p>

    <h1>{{ page.title }}</h1>

    {% if page.categories %}
      <div class="post-categories">
        {% for category in page.categories %}
          <span>{{ category }}</span>
        {% endfor %}
      </div>
    {% endif %}

  </div>

  <div class="post-content">
    {{ content }}
  </div>

  <a class="back-link" href="{{ '/' | relative_url }}">
    ← Back to home
  </a>

</article>
